name: build

on:
  push:
    branches: [ "master" ]
  pull_request:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: 1.85.0

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive

      - name: Set up Payjoin CI
        uses: ./.github/actions/prepare-ci-build
        with:
          rust-toolchain: ${{ env.RUSTUP_TOOLCHAIN }}

      - name: Run unit tests
        run: dotnet test "BTCPayServer.Plugins.Payjoin.Tests/BTCPayServer.Plugins.Payjoin.Tests.csproj" -c Release --no-build --no-restore
